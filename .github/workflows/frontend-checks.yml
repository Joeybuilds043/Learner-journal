name: Frontend checks

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "ai-workspace.js"
      - "macro-dashboard.js"
      - "marketpilot-config.js"
      - "sw.js"
      - "manifest.json"
      - ".github/workflows/frontend-checks.yml"
  pull_request:
    paths:
      - "index.html"
      - "ai-workspace.js"
      - "macro-dashboard.js"
      - "marketpilot-config.js"
      - "sw.js"
      - "manifest.json"
      - ".github/workflows/frontend-checks.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate JavaScript
        run: |
          node --check macro-dashboard.js
          node --check ai-workspace.js
          node --check marketpilot-config.js
          node --check sw.js
      - name: Smoke-test live macro data endpoints
        env:
          MARKET_DATA_URL: https://marketsignal-data.joeybuilds043.workers.dev
        run: |
          node <<'NODE'
          const base = process.env.MARKET_DATA_URL;
          async function get(path) {
            const response = await fetch(base + path, { signal: AbortSignal.timeout(30000), cache: "no-store" });
            const body = await response.json();
            if (!response.ok) throw new Error(path + " returned HTTP " + response.status + ": " + (body.detail || body.error || "request failed"));
            return body;
          }
          (async () => {
            const snapshot = await get("/");
            if (!snapshot.data || !snapshot.provider) throw new Error("Macro snapshot response is missing its data contract.");
            const history = await get("/history?series=us10y&range=1y");
            if (!Array.isArray(history.points) || history.points.length < 2) throw new Error("US10Y history did not return enough dated observations.");
            console.log("PASS - macro snapshot endpoint");
            console.log("PASS - US10Y historical series (" + history.points.length + " observations)");
            console.log("Macro snapshot mode: " + (snapshot.partial ? "partial, with source warnings" : "all requested series available"));
          })().catch(error => { console.error(error); process.exitCode = 1; });
          NODE
      - name: Validate app invariants and inline scripts
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const vm = require("node:vm");
          const html = fs.readFileSync("index.html", "utf8");
          const ai = fs.readFileSync("ai-workspace.js", "utf8");
          const macro = fs.readFileSync("macro-dashboard.js", "utf8");
          const sw = fs.readFileSync("sw.js", "utf8");
          const config = fs.readFileSync("marketpilot-config.js", "utf8");
          const manifest = JSON.parse(fs.readFileSync("manifest.json", "utf8"));
          const scripts = [...html.matchAll(/<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)<\/script>/gi)];
          for (let i = 0; i < scripts.length; i++) {
            new vm.Script(scripts[i][1], { filename: "index-inline-" + (i + 1) + ".js" });
          }
          const checks = {
            "MarketPulse AI brand": html.includes("<h1>MarketPulse AI</h1>"),
            "Legacy journal storage key": html.includes('const KEY = "learner-journal-entries-v1";'),
            "Frontend config variable": ai.includes("window.MARKETPILOT_API_BASE") && !ai.includes("MARKETSCOPE_API_BASE"),
            "Separate optional AI URL": config.includes("MARKETPILOT_AI_API_BASE"),
            "Local daily request cap": ai.includes("marketpilot-ai-usage-v1"),
            "Conversation follow-up context": ai.includes("buildConversationQuestion(q)"),
            "Hamburger navigation": ai.includes("M4 6.5H20M4 12H20M4 17.5H20"),
            "PWA name": manifest.short_name === "MarketPulse",
            "Structured daily desk brief": ai.includes("function renderDailyBrief(report)") && ai.includes("report.brief"),
            "Fresh cross-asset snapshots": ai.includes("getAllCrossAssetData(true)") && ai.includes("lastAssets=await fetchAssets()"),
            "Compact charts": ai.includes(".ms-chartbox svg{height:168px!important}") && ai.includes(".ms-cpi-chart svg{height:150px!important}") && ai.includes(".mp-history-chart svg{height:138px!important}"),
            "AI page is not duplicated on dashboard": ai.includes('$("aiView").hidden=name!=="ai"') && !ai.includes('$("aiView").hidden=!(name==="ai"||name==="markets")'),
            "Homepage AI analyst launch card": ai.includes("mpHomeAgent") && ai.includes("Illustrated senior investor analyst mascot") && ai.includes('setView("ai");$("mpQuestion").focus()'),
            "AI answer Markdown rendering": ai.includes("function appendInline(target,text)") && ai.includes('source.split("\\n")') && ai.includes('line.match(/^(#{1,6})\\s+(.+)$/)') && ai.includes('line.match(/^[-*+•]\\s+(.+)$/)'),
            "Inline Markdown list normalization": ai.includes("Inline Markdown normalization") && ai.includes("source.replace(/([.:;])\\s+([*+•-])\\s+/g"),
            "Ask AI Analyst labelling": ai.includes("<h2>Ask AI Analyst</h2>") && ai.includes("ASK AI ANALYST") && ai.includes(">Ask AI ↗</button>"),
            "Welcome banner removed": !ai.includes('id="mpWelcome"') && !ai.includes("Welcome to Your Personal Trading Analysis App."),
            "Saad Hashmani credit line": html.includes("Inspired by Saad Hashmani’s market insights and disciplined analytical approach."),
            "Historical 1–5 year choices": ["1y","2y","3y","4y","5y"].every(range => ai.includes('value="'+range+'"')),
            "Historical analysis uses shared Markdown renderer": ai.includes('renderAnswer(host,result.answer||"No analysis returned.")') && ai.includes('id="mpHistoryAnalysis" class="mp-answer-block'),
            "Historical statistics passed to analyst": ai.includes("statistics:historyComparisonStats") && ai.includes("pairedMonthlyObservations:paired.length"),
            "Historical AI analysis matches selected markets and period": ai.includes('historyRange!==selectedRange') && ai.includes('historyA.symbol!==$("mpHistoryA").value') && ai.includes('historyB.symbol!==$("mpHistoryB").value'),
            "Market charts load even if the summary snapshot fails": macro.includes("finally{button.disabled=false;loadMetricCharts();}") && macro.includes("async function loadMetricCharts()"),
            "Finance-watchlist mini charts": macro.includes("ms-metric-history-head") && macro.includes("ms-metric-trend") && macro.includes("msMetricArea"),
            "Market chart aspect ratios preserved": ai.includes(".ms-chartbox svg{height:auto!important;aspect-ratio:720 / 210") && ai.includes(".ms-cpi-chart svg{height:auto!important;aspect-ratio:720 / 210"),
            "Partial macro readings remain visible": macro.includes("error:d.us10y?.error") && macro.includes("successful series remain visible."),
            "Market chart errors do not suppress independent history": macro.includes("finally{button.disabled=false;loadMetricCharts();}") && macro.includes("Latest history refresh unavailable; showing last successful chart."),
            "PWA caches the current dashboard scripts": html.includes("macro-dashboard.js?v=20261031-marketpulse-v12") && sw.includes("macro-dashboard.js?v=20261031-marketpulse-v12") && html.includes("marketpilot-config.js?v=20261031-marketpulse-branding-v2") && sw.includes("marketpilot-config.js?v=20261031-marketpulse-branding-v2"),
          };
          const failed = Object.entries(checks).filter(([, ok]) => !ok);
          for (const [name, ok] of Object.entries(checks)) {
            console.log((ok ? "PASS" : "FAIL") + " - " + name);
          }
          if (failed.length) throw new Error("Failed checks: " + failed.map(([name]) => name).join(", "));
          console.log("Inline scripts and frontend invariants validated.");
          NODE
