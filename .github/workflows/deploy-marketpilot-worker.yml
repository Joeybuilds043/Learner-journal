name: Deploy MarketPilot AI Worker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Wrangler
        run: npm install --global wrangler
      - name: Configure server-side OpenAI secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "407babe753dcb5f3a6c2c0bcad2da2b6"
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "Missing repository secret OPENAI_API_KEY."
            exit 1
          fi
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "Missing repository secret CLOUDFLARE_API_TOKEN."
            exit 1
          fi
          printf '%s' "$OPENAI_API_KEY" | wrangler secret put OPENAI_API_KEY --config wrangler.toml
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "407babe753dcb5f3a6c2c0bcad2da2b6"
        run: wrangler deploy --config wrangler.toml
      - name: Verify service health
        run: |
          curl --fail --silent --show-error --max-time 20 https://marketpilot-ai.joeybuilds043.workers.dev/health -o health.json
          python - <<'PY'
          import json
          data = json.load(open("health.json"))
          assert data.get("ok") is True, data
          assert data.get("openAIConfigured") is True, data
          print("OpenAI-backed MarketPilot AI is live.")
          PY
