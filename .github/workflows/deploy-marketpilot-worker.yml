name: Deploy MarketPilot AI Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "worker/index.js"
      - "wrangler.toml"
      - ".github/workflows/deploy-marketpilot-worker.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Wrangler
        run: npm install --global wrangler
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "407babe753dcb5f3a6c2c0bcad2da2b6"
        run: wrangler deploy --config wrangler.toml
      - name: Verify service health
        run: |
          curl --fail --silent --show-error --max-time 20 https://marketpilot-ai.joeybuilds043.workers.dev/health -o health.json
          python - <<'PY'
          import json
          data = json.load(open("health.json"))
          assert data.get("ok") is True, data
          assert data.get("provider") == "Cloudflare Workers AI", data
          print("Cloudflare Workers AI-backed MarketPilot AI is live.")
          PY
      - name: Verify financial-education answers are relevant
        run: |
          status=$(curl --silent --show-error --max-time 90 -w "%{http_code}" \
            -H "Content-Type: application/json" \
            -X POST \
            -d '{"question":"Explain the difference between swaps and forwards. Compare contract structure, cash flows, settlement, common use cases and counterparty risk. Include one clearly hypothetical numerical example.","assets":[],"marketGroups":{},"macro":{}}' \
            https://marketpilot-ai.joeybuilds043.workers.dev/api/analyze -o finance-answer.json)
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "AI endpoint returned HTTP $status. Response details:"
            cat finance-answer.json
            exit 1
          fi
          python - <<'PY'
          import json
          data = json.load(open("finance-answer.json"))
          assert data.get("ok") is True, data
          assert data.get("provider") == "Cloudflare Workers AI", data
          answer = data.get("answer", "").lower()
          assert len(answer) > 200 and "swap" in answer and "forward" in answer, data
          assert any(term in answer for term in ("cash flow", "settlement", "hypothetical", "example")), data
          print("Cloudflare AI finance education test passed with a direct swaps-vs-forwards answer.")
          PY
      - name: Verify source-backed macro chart history
        run: |
          curl --fail --silent --show-error --max-time 25 "https://marketpilot-ai.joeybuilds043.workers.dev/api/macro-history?series=CPIAUCSL&range=1y" -o macro-history.json
          python - <<'PY'
          import json
          data = json.load(open("macro-history.json"))
          assert data.get("source", "").startswith("Federal Reserve Bank of St. Louis FRED"), data
          assert len(data.get("points", [])) >= 6, data
          print("FRED CPI history endpoint passed.")
          PY
