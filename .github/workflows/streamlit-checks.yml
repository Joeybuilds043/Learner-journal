name: Streamlit app checks

on:
  push:
    branches: [main]
    paths:
      - "streamlit_app.py"
      - "requirements.txt"
      - "README.md"
      - "STREAMLIT_SETUP.md"
      - ".github/workflows/streamlit-checks.yml"
  pull_request:
    paths:
      - "streamlit_app.py"
      - "requirements.txt"
      - "README.md"
      - "STREAMLIT_SETUP.md"
      - ".github/workflows/streamlit-checks.yml"

permissions:
  contents: read

jobs:
  compile-and-import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Check Python syntax
        run: python -m py_compile streamlit_app.py
      - name: Check model, calculations and navigation
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path("streamlit_app.py").read_text(encoding="utf-8")
          checks = {
              "Gemini 3.8 Flash default": 'GEMINI_DEFAULT_MODEL = "gemini-3.8-flash"' in source,
              "Gemini server-side API key": 'get_secret("GEMINI_API_KEY")' in source,
              "Provider can be explicitly selected": 'get_secret("AI_PROVIDER") or "gemini"' in source,
              "Gemini generateContent endpoint": "generateContent" in source,
              "Output token cap": '"maxOutputTokens": 1200' in source,
              "Daily app request cap": "consume_session_ai_request()" in source,
              "CPI no missing-value forward fill": 'pct_change(12, fill_method=None)' in source,
              "PPI no missing-value forward fill": 'pct_change(12, fill_method=None)' in source,
              "Historical return gaps not forward-filled": 'pct_change(fill_method=None)' in source,
              "Three-dot navigation": 'st.popover("⋮ Menu"' in source,
              "Legacy Pages journal key untouched": "learner-journal-entries-v1" not in source,
          }
          failed = [name for name, ok in checks.items() if not ok]
          for name, ok in checks.items():
              print(("PASS" if ok else "FAIL") + " - " + name)
          if failed:
              raise SystemExit("Failed checks: " + ", ".join(failed))
          PY
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check imports
        run: python -c "import pandas, plotly, requests, streamlit; print('MarketPilot Streamlit imports OK')"
