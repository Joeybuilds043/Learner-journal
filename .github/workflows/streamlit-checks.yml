name: Streamlit app checks

on:
  push:
    branches: [main]
    paths:
      - "streamlit_app.py"
      - "requirements.txt"
      - "README.md"
      - "STREAMLIT_SETUP.md"
      - ".github/workflows/streamlit-checks.yml"
  pull_request:
    paths:
      - "streamlit_app.py"
      - "requirements.txt"
      - ".github/workflows/streamlit-checks.yml"

permissions:
  contents: read

jobs:
  compile-and-import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Check Python syntax
        run: python -m py_compile streamlit_app.py
      - name: Check app routes, charts and Grok configuration
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path("streamlit_app.py").read_text(encoding="utf-8")
          checks = {
              "Grok Responses API": "https://api.x.ai/v1/responses" in source,
              "server-side XAI_API_KEY": 'get_secret("XAI_API_KEY")' in source,
              "Grok 4.7 default": 'GROK_DEFAULT_MODEL = "grok-4.7"' in source,
              "CPI bars and 3-month average": "def inflation_chart(" in source and 'rolling(3, min_periods=2).mean()' in source,
              "three-dot navigation": 'st.popover("⋮ Menu"' in source,
              "no horizontal navigation row": 'st.radio("Main navigation", pages, horizontal=True' not in source,
              "Saad Hashmani credit": "Inspired by Saad Hashmani" in source,
              "Atlas analyst route": 'elif page == "AI Analyst":' in source,
              "Daily Brief loads data": 'page in ("Markets", "Daily Brief", "AI Analyst", "Historical Patterns")' in source,
              "Profile route": 'elif page == "Profile":' in source,
              "legacy journal storage untouched": "learner-journal-entries-v1" not in source,
          }
          failed = [name for name, ok in checks.items() if not ok]
          for name, ok in checks.items():
              print(("PASS" if ok else "FAIL") + " - " + name)
          if failed:
              raise SystemExit("Failed checks: " + ", ".join(failed))
          PY
      - name: Install application dependencies
        run: python -m pip install -r requirements.txt
      - name: Check imports
        run: python -c "import pandas, plotly, requests, streamlit; print('CandleDesk imports OK')"
