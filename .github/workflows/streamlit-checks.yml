name: Streamlit app checks

on:
  push:
    branches: [main]
    paths:
      - "streamlit_app.py"
      - "requirements.txt"
      - ".github/workflows/streamlit-checks.yml"
  pull_request:
    paths:
      - "streamlit_app.py"
      - "requirements.txt"
      - ".github/workflows/streamlit-checks.yml"

permissions:
  contents: read

jobs:
  compile-and-import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Check Python syntax
        run: python -m py_compile streamlit_app.py
      - name: Install application dependencies
        run: python -m pip install -r requirements.txt
      - name: Check imports
        run: python -c "import pandas, plotly, requests, streamlit; print('CandleDesk imports OK')"
