name: MarketPilot live API smoke test

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/marketpilot-api-smoke.yml"

permissions:
  contents: read

jobs:
  live-api:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check Atlas AI service health
        run: |
          curl --fail --silent --show-error --max-time 20 -H "Origin: https://joeybuilds043.github.io" -D health.headers https://marketpilot-ai.joeybuilds043.workers.dev/health -o health.json
          grep -qi "access-control-allow-origin: https://joeybuilds043.github.io" health.headers
          cat health.json
          python - <<'PY'
          import json
          data = json.load(open("health.json"))
          assert data.get("ok") is True, data
          assert data.get("model"), data
          if data.get("openAIConfigured"):
              assert data.get("provider") == "OpenAI API", data
          else:
              assert "fallback" in data.get("provider", "").lower(), data
          print("Atlas health endpoint passed; provider:", data.get("provider"))
          PY
      - name: Check cross-asset market data route
        run: |
          curl --fail --silent --show-error --max-time 35 "https://marketpilot-ai.joeybuilds043.workers.dev/api/markets?group=stocks" -o markets.json
          cat markets.json
          python - <<'PY'
          import json
          data = json.load(open("markets.json"))
          assets = data.get("assets", [])
          symbols = {item.get("symbol") for item in assets}
          assert {"^GSPC", "^IXIC", "^DJI"} <= symbols, data
          print("Cross-asset market route passed.")
          PY
      - name: Check crypto route through the same API
        run: |
          curl --silent --show-error --max-time 35 "https://marketpilot-ai.joeybuilds043.workers.dev/api/markets?group=crypto" -o crypto.json
          cat crypto.json
          python - <<'PY'
          import json
          data = json.load(open("crypto.json"))
          assets = data.get("assets", [])
          required = {"BTC-USD", "ETH-USD", "SOL-USD", "BNB-USD", "XRP-USD"}
          assert required <= {item.get("symbol") for item in assets}, data
          assert all(float(item.get("price") or 0) > 0 for item in assets), data
          assert all(item.get("source") in {"CoinPaprika", "Binance spot"} for item in assets), data
          print("Crypto market route returned positive quotes for all five assets.")
          PY
      - name: Check Forex and commodities routes
        run: |
          for group in forex commodities; do
            curl --fail --silent --show-error --max-time 35 "https://marketpilot-ai.joeybuilds043.workers.dev/api/markets?group=$group" -o "$group.json"
          done
          python - <<'PY'
          import json
          expectations = {
              "forex": {"EURUSD=X", "GBPUSD=X", "AUDUSD=X"},
              "commodities": {"GC=F", "SI=F", "CL=F"},
          }
          for group, required in expectations.items():
              data = json.load(open(f"{group}.json"))
              symbols = {item.get("symbol") for item in data.get("assets", [])}
              assert required <= symbols, (group, data)
          print("Forex and commodities routes passed.")
          PY
      - name: Check historical chart API
        run: |
          curl --fail --silent --show-error --max-time 35 "https://marketpilot-ai.joeybuilds043.workers.dev/api/history?symbol=%5EGSPC&range=5y" -o history.json
          python - <<'PY'
          import json
          data = json.load(open("history.json"))
          points = data.get("points", [])
          assert data.get("symbol") == "^GSPC", data
          assert len(points) >= 12, data
          assert all("date" in point and isinstance(point.get("value"), (int, float)) for point in points), data
          print("Historical chart route returned", len(points), "dated monthly observations.")
          PY
      - name: Test one real model response
        run: |
          python - <<'PY'
          import json
          snapshots = {}
          files = {"crypto": "crypto.json", "stocks": "markets.json", "forex": "forex.json", "commodities": "commodities.json"}
          for group, filename in files.items():
              snapshots[group] = json.load(open(filename))
          payload = {
              "question": "Using the supplied market snapshots, explain today's cross-asset picture in plain English. Clearly separate observed quotes from interpretation, and do not invent news.",
              "assets": snapshots["crypto"].get("assets", []),
              "marketGroups": snapshots,
              "macro": {"note": "Smoke test context; app supplies the live FRED macro Worker response."}
          }
          json.dump(payload, open("analysis-request.json", "w"))
          PY
          curl --fail --silent --show-error --max-time 90 -H "Content-Type: application/json" -X POST -d @analysis-request.json https://marketpilot-ai.joeybuilds043.workers.dev/api/analyze -o answer.json
          cat answer.json
          python - <<'PY'
          import json
          data = json.load(open("answer.json"))
          assert data.get("ok") is True, data
          assert "answer" in data and len(data["answer"].strip()) > 20, data
          print("Live model inference passed using:", data.get("model"))
          PY
      - name: Test direct financial-concept answer
        run: |
          printf '%s' '{"question":"Explain the difference between a forward contract and an interest-rate swap to a beginner. Give a clear side-by-side comparison and one simple hypothetical numerical example. Do not give a generic market report.","assets":[],"marketGroups":{},"macro":{}}' > concept-request.json
          curl --fail --silent --show-error --max-time 90 -H "Content-Type: application/json" -X POST -d @concept-request.json https://marketpilot-ai.joeybuilds043.workers.dev/api/analyze -o concept-answer.json
          python - <<'PY'
          import json
          data = json.load(open("concept-answer.json"))
          assert data.get("ok") is True, data
          answer = data.get("answer", "").lower()
          assert "forward" in answer and "swap" in answer, data
          assert len(answer) > 200, data
          print("Finance concept response passed using:", data.get("model"))
          PY
