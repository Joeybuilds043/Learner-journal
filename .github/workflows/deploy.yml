name: Deploy MarketPilot AI to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "ai-workspace.js"
      - "macro-dashboard.js"
      - "marketpilot-config.js"
      - "sw.js"
      - ".github/workflows/deploy.yml"
      - "manifest.json"
      - "marketscope-mark.svg"
      - "icons/**"
      - "assets/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate JavaScript and product invariants
        shell: bash
        run: |
          node --check macro-dashboard.js
          node --check ai-workspace.js
          node --check marketpilot-config.js
          node --check sw.js
          node <<'NODE'
          const fs = require("node:fs");
          const vm = require("node:vm");
          const html = fs.readFileSync("index.html", "utf8");
          const ai = fs.readFileSync("ai-workspace.js", "utf8");
          const config = fs.readFileSync("marketpilot-config.js", "utf8");
          const manifest = JSON.parse(fs.readFileSync("manifest.json", "utf8"));
          const scripts = [...html.matchAll(/<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)<\/script>/gi)];
          for (let i = 0; i < scripts.length; i++) {
            new vm.Script(scripts[i][1], { filename: "index-inline-" + (i + 1) + ".js" });
          }
          if (!html.includes("<h1>MarketPulse AI</h1>")) throw new Error("Missing MarketPulse AI brand");
          if (!html.includes('const KEY = "learner-journal-entries-v1";')) throw new Error("Legacy journal key changed");
          if (!ai.includes("window.MARKETPILOT_API_BASE") || ai.includes("MARKETSCOPE_API_BASE")) throw new Error("Frontend API config mismatch");
          if (!ai.includes("marketpilot-ai-usage-v1")) throw new Error("Browser-side AI usage guard missing");
          if (!ai.includes(".app-nav{display:none!important}") || !ai.includes("M4 6.5H20M4 12H20M4 17.5H20")) throw new Error("Hamburger navigation invariant failed");
          if (manifest.short_name !== "MarketPulse") throw new Error("PWA name mismatch");
          if (!config.includes("MARKETPILOT_AI_API_BASE")) throw new Error("Optional AI endpoint setting missing");
          console.log("Validated app shell, local journal key, API routing, navigation and inline JavaScript.");
          NODE

      - name: Package static site
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          cp -R . "$RUNNER_TEMP/site/"
          rm -rf "$RUNNER_TEMP/site/.git" "$RUNNER_TEMP/site/.github"
          tar --dereference --hard-dereference --directory "$RUNNER_TEMP/site" -cvf "$RUNNER_TEMP/artifact.tar" .

      - name: Upload site artifact
        uses: actions/upload-artifact@v7
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          if-no-files-found: error
          retention-days: 1

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4

      # No live model inference here. Deployment must not spend free AI quota
      # or fail because a provider is temporarily rate-limited or unavailable.
