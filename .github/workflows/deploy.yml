name: Deploy MarketSignal to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "ai-workspace.js"
      - "macro-dashboard.js"
      - "marketpilot-config.js"
      - "sw.js"
      - ".github/workflows/deploy.yml"
      - ".github/workflows/marketpilot-checks.yml"
      - "manifest.json"
      - "marketsignal-mark.svg"
      - "icons/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Package static site
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          cp -R . "$RUNNER_TEMP/site/"
          rm -rf "$RUNNER_TEMP/site/.git" "$RUNNER_TEMP/site/.github"
          tar --dereference --hard-dereference \
            --directory "$RUNNER_TEMP/site" \
            -cvf "$RUNNER_TEMP/artifact.tar" \
            --exclude=.git \
            --exclude=.github \
            --exclude='.[^/]*' \
            .

      - name: Upload site artifact with Node 24-compatible action
        uses: actions/upload-artifact@v7
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          if-no-files-found: error
          retention-days: 1

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke test live site and macro API
        shell: bash
        run: |
          node <<'NODE'
          const assert = require("node:assert/strict");

          const pageUrl = "https://joeybuilds043.github.io/Learner-journal/";
          const apiUrl = "https://marketsignal-data.joeybuilds043.workers.dev/";
          const origin = "https://joeybuilds043.github.io";
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

          async function getWithRetry(url, options = {}, attempts = 8) {
            let lastError;
            for (let attempt = 1; attempt <= attempts; attempt++) {
              try {
                const response = await fetch(url, options);
                if (response.ok) return response;
                lastError = new Error(`HTTP ${response.status} for ${url}`);
              } catch (error) {
                lastError = error;
              }
              if (attempt < attempts) await sleep(5000);
            }
            throw lastError || new Error(`Request failed: ${url}`);
          }

          (async () => {
            const pageResponse = await getWithRetry(pageUrl);
            const html = await pageResponse.text();

            // Check the published JavaScript itself, not only the HTML reference.
            const scriptResponse = await getWithRetry(pageUrl + "macro-dashboard.js");
            const script = await scriptResponse.text();
            assert.ok(script.includes("https://marketsignal-data.joeybuilds043.workers.dev/"),
              "Published dashboard must call the current Worker");
            assert.ok(!script.includes("marketsignal-data.asadlang05.workers.dev"),
              "Published dashboard must not call the retired Worker");
            assert.match(html, /macro-dashboard\.js/, "Live page must load the macro dashboard script");
            assert.match(html, /<h1>MarketPilot<\/h1>/, "Live page must use the MarketPilot brand");
            assert.match(html, /ai-workspace\.js/, "Live page must load the new workspace script");

            const aiResponse = await getWithRetry(pageUrl + "ai-workspace.js?v=20261024-analyst-polish");
            const aiScript = await aiResponse.text();
            for (const marker of ["Financial Research Desk", "Daily Market Briefing", "Macro &amp; Market History", "News &amp; Market Impact", "Your Journal", "mpAssetPrompts", "Profile &amp; Preferences", "AI Market Analyst", "Historical Patterns", "mpClearChat", "Saad Hashmani’s market-focused content sparked my interest"]) {
              assert.ok(aiScript.includes(marker), `Published AI workspace is missing ${marker}`);
            }

            const apiResponse = await getWithRetry(apiUrl, {
              headers: { Origin: origin, "Cache-Control": "no-cache" }
            });
            assert.equal(apiResponse.headers.get("access-control-allow-origin"), origin,
              "Worker must allow the current GitHub Pages origin");

            const payload = await apiResponse.json();
            assert.equal(payload.provider, "Federal Reserve Economic Data (FRED)",
              "Worker must return the FRED provider payload");
            for (const key of ["us10y", "dollar", "cpi", "ppi"]) {
              assert.ok(payload.data?.[key]?.date && Number.isFinite(payload.data?.[key]?.value),
                `Missing latest data for ${key}`);
            }

            const historyResponse = await getWithRetry(
              apiUrl + "history?series=us10y&range=30d",
              { headers: { Origin: origin, "Cache-Control": "no-cache" } },
              3
            );
            assert.equal(historyResponse.headers.get("access-control-allow-origin"), origin,
              "History endpoint must allow the current GitHub Pages origin");
            const history = await historyResponse.json();
            assert.ok(Array.isArray(history.points) && history.points.length > 0,
              "History endpoint must return at least one observation");

            const atlasUrl = "https://marketpilot-ai.joeybuilds043.workers.dev";
            const atlasHealthResponse = await getWithRetry(atlasUrl + "/health", {
              headers: { Origin: origin, "Cache-Control": "no-cache" }
            });
            const atlasHealth = await atlasHealthResponse.json();
            assert.equal(atlasHealth.ok, true, "Atlas AI service must be online");
            if (atlasHealth.openAIConfigured) {
              assert.match(atlasHealth.provider || "", /openai/i, "Configured OpenAI secret must select the OpenAI provider");
              assert.match(atlasHealth.model || "", /^gpt-/i, "Atlas must report the configured GPT model");
            } else {
              assert.equal(atlasHealth.provider, "Cloudflare Workers AI", "Atlas must report the free Cloudflare AI provider");
              assert.match(atlasHealth.model || "", /glm|zai/i, "Atlas must report the configured free GLM model");
            }

            const atlasMarketsResponse = await getWithRetry(atlasUrl + "/api/markets?group=stocks", {
              headers: { Origin: origin, "Cache-Control": "no-cache" }
            });
            const atlasMarkets = await atlasMarketsResponse.json();
            assert.equal(atlasMarkets.group, "stocks", "Atlas must expose cross-asset market quotes");
            assert.equal(atlasMarkets.assets?.length, 3, "Atlas must return S&P 500, Nasdaq and Dow Jones quote slots");

            const atlasAnalysisResponse = await fetch(atlasUrl + "/api/analyze", {
              method: "POST",
              headers: { Origin: origin, "Content-Type": "application/json" },
              body: JSON.stringify({
                question: "In two short sentences, explain how rising Treasury yields can affect growth stocks.",
                assets: [],
                macro: {},
                marketGroups: {}
              }),
              signal: AbortSignal.timeout(90000)
            });
            assert.equal(atlasAnalysisResponse.status, 200, "Atlas AI analysis endpoint must respond successfully");
            const atlasAnalysis = await atlasAnalysisResponse.json();
            assert.ok(typeof atlasAnalysis.answer === "string" && atlasAnalysis.answer.length > 30,
              "Atlas must return a substantive AI-generated answer");

            console.log("Smoke test passed: GitHub Pages, FRED macro API, journal history, Atlas AI inference and cross-asset market endpoint.");
          })().catch(error => {
            console.error(error.message || error);
            process.exitCode = 1;
          });
          NODE
