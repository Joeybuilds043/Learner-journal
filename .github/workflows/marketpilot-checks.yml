name: MarketPilot source checks

on:
  push:
    branches: ["main", "feature/marketpilot-ai-phase1"]
    paths:
      - "index.html"
      - "ai-workspace.js"
      - "macro-dashboard.js"
      - "marketpilot-config.js"
      - "sw.js"
      - "worker/**"
      - "wrangler.toml"
      - "backend/**"
      - ".github/workflows/**"
      - ".github/workflows/deploy-marketpilot-worker.yml"
  workflow_dispatch:
  pull_request:
    paths:
      - "index.html"
      - "ai-workspace.js"
      - "macro-dashboard.js"
      - "worker/**"
      - "wrangler.toml"
      - ".github/workflows/deploy-marketpilot-worker.yml"
      - "marketpilot-config.js"
      - "sw.js"
      - "backend/**"
      - ".github/workflows/marketpilot-checks.yml"

concurrency:
  group: marketpilot-source-checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  syntax-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check frontend JavaScript syntax
        run: |
          node --check ai-workspace.js
          node --check macro-dashboard.js
          node --check marketpilot-config.js
          node --check worker/index.js
      - name: Check Python syntax
        run: python -m compileall -q backend
      - name: Check required app files and navigation
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text()
          js = Path('ai-workspace.js').read_text()
          all_js = js + Path('macro-dashboard.js').read_text()
          assert 'MarketPilot AI' in html
          assert 'ai-workspace.js' in html
          for section in ['Markets', 'Charts', 'Financial Analyst', 'Research Briefing', 'Trade Journal', 'Workspace Settings', 'Macro &amp; Market History', 'News &amp; Market Impact']:
              assert section in js, f'Missing navigation/section: {section}'
          assert 'learner-journal-entries-v1' in html, 'Legacy journal storage key must be preserved in index.html'
          assert 'marketpilot-ai.joeybuilds043.workers.dev' in Path('marketpilot-config.js').read_text(), 'Atlas AI endpoint must be configured in public frontend settings'
          worker = Path('worker/index.js').read_text()
          assert '/api/history' in worker and '/api/news' in worker and 'query1.finance.yahoo.com/v1/finance/search' in worker
          assert '@cf/zai-org/glm-4.7-flash' in worker and 'HISTORICAL SERIES' in worker
          assert 'You are Atlas, a senior financial-markets analyst' in worker, 'Keep the financial analyst system prompt'
          assert 'cpi_yoy' in Path('macro-dashboard.js').read_text(), 'CPI year-over-year history chart must be available'
          assert 'msAreaGradient' in Path('macro-dashboard.js').read_text(), 'Historical charts must use enhanced visual treatment'
          assert 'mpClearChat' in js, 'Financial analyst chat must have a clear-chat control'
          assert 'Inspired by Saad Hashmani' in js, 'Project inspiration credit must remain visible'
          assert 'citationMap' in worker, 'Live news should preserve source citations'
          loader_start = js.index('async function fetchAssets()')
          loader_end = js.index('function usd(n)', loader_start)
          asset_loader = js[loader_start:loader_end]
          assert 'const menuButton=document.createElement' not in asset_loader, 'Navigation handlers must not be nested in the crypto loader'
          assert js.index('const menuButton=document.createElement') > js.index('checkAIService();refreshAssets();showMarketGroup("crypto");setView("markets");'), 'Navigation/menu initialization must run at app scope'
          assert 'function renderAnswer' in js, 'Financial answers should render structured text'
          assert 'if($("mpDrawer"))$("mpDrawer").hidden=true' in js, 'Opening markets before the menu exists must not throw'
          assert 'const macroHistoryTools=document.getElementById("ms-history-tools")' in js, 'Move macro history to the Historical section'
          assert 'id="asset"' in html and 'id="mistake"' in html and 'id="betterAction"' in html, 'Journal needs the asset and trade-reflection fields'
          assert 'learner-journal-entries-v1' in html, 'Legacy journal storage key must be preserved in index.html'
          assert 'Cloudflare Workers AI' in Path('.github/workflows/deploy-marketpilot-worker.yml').read_text()
          assert 'CLOUDFLARE_API_TOKEN' in Path('.github/workflows/deploy-marketpilot-worker.yml').read_text()
          assert 'GEMINI_API_KEY' in Path('backend/main.py').read_text()  # optional Python/CrewAI scaffold only
          print('MarketPilot source checks passed.')
          PY
