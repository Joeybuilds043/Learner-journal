name: MarketPilot source checks

on:
  push:
    branches: ["main", "feature/marketpilot-ai-phase1"]
    paths:
      - "index.html"
      - "ai-workspace.js"
      - "macro-dashboard.js"
      - "marketpilot-config.js"
      - "sw.js"
      - "worker/**"
      - "wrangler.toml"
      - "backend/**"
      - ".github/workflows/**"
      - ".github/workflows/deploy-marketpilot-worker.yml"
  pull_request:
    paths:
      - "index.html"
      - "ai-workspace.js"
      - "macro-dashboard.js"
      - "worker/**"
      - "wrangler.toml"
      - ".github/workflows/deploy-marketpilot-worker.yml"
      - "marketpilot-config.js"
      - "sw.js"
      - "backend/**"
      - ".github/workflows/marketpilot-checks.yml"

concurrency:
  group: marketpilot-source-checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  syntax-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check frontend JavaScript syntax
        run: |
          node --check ai-workspace.js
          node --check macro-dashboard.js
          node --check marketpilot-config.js
          node --check worker/index.js
      - name: Check Python syntax
        run: python -m compileall -q backend
      - name: Check required app files and navigation
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text()
          js = Path('ai-workspace.js').read_text()
          all_js = js + Path('macro-dashboard.js').read_text()
          assert 'MarketPilot AI' in html
          assert 'ai-workspace.js' in html
          for section in ['Markets', 'AI Analyst', 'Daily Brief', 'Your Journal', 'Profile', 'Historical Patterns', 'News & Impact']:
              assert section in js, f'Missing navigation/section: {section}'
          assert 'learner-journal-entries-v1' in html, 'Legacy journal storage key must be preserved in index.html'
          assert 'marketpilot-ai.joeybuilds043.workers.dev' in Path('marketpilot-config.js').read_text(), 'Atlas AI endpoint must be configured in public frontend settings'
          worker = Path('worker/index.js').read_text()
          assert '/api/history' in worker and '/api/news' in worker and 'api.openai.com/v1/responses' in worker
          assert 'OPENAI_API_KEY' in worker and 'HISTORICAL SERIES' in worker
          assert 'GEMINI_API_KEY' in Path('backend/main.py').read_text()  # optional Python/CrewAI scaffold only
          print('MarketPilot source checks passed.')
          PY
