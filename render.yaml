services:
  - type: web
    name: marketpilot-ai-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PAGES_ORIGIN
        value: https://joeybuilds043.github.io
      - key: FRED_WORKER_URL
        value: https://marketsignal-data.joeybuilds043.workers.dev/
      - key: GEMINI_MODEL
        value: gemini/gemini-2.5-flash
      - key: MAX_REQUESTS_PER_MINUTE
        value: "8"
      - key: GEMINI_API_KEY
        sync: false
